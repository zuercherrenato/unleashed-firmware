<title>Bodenleger Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed 3D diorama of two job sites; the HUD floats over it on desktop and stacks under it on phones. */
:root {
  --bg: #DDE3E7;
  --bg2: #F1F4F6;
  --panel: rgba(255, 255, 255, .9);
  --panel-solid: #FFFFFF;
  --ink: #16202A;
  --muted: #5A6772;
  --line: rgba(22, 32, 42, .12);
  --chip: #EDF1F4;
  --accent: #D9530F;      /* hi-vis orange */
  --accent-ink: #FFFFFF;
  --resin: #B87A12;       /* primer amber */
  --ok: #1D8A4B;
  --warn: #B87005;
  --crit: #C8392C;
  --shadow: 0 8px 28px rgba(22, 32, 42, .12), 0 1px 3px rgba(22, 32, 42, .08);
  --f-display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1216; --bg2: #18212A; --panel: rgba(20, 27, 34, .92); --panel-solid: #151C23;
    --ink: #E4E9ED; --muted: #94A1AC; --line: rgba(228, 233, 237, .13); --chip: #222C35;
    --accent: #F2763A; --accent-ink: #1A0E06; --resin: #E2A646;
    --ok: #3CBB72; --warn: #E4A43C; --crit: #F0624F;
    --shadow: 0 10px 30px rgba(0, 0, 0, .45), 0 1px 3px rgba(0, 0, 0, .4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1216; --bg2: #18212A; --panel: rgba(20, 27, 34, .92); --panel-solid: #151C23;
  --ink: #E4E9ED; --muted: #94A1AC; --line: rgba(228, 233, 237, .13); --chip: #222C35;
  --accent: #F2763A; --accent-ink: #1A0E06; --resin: #E2A646;
  --ok: #3CBB72; --warn: #E4A43C; --crit: #F0624F;
  --shadow: 0 10px 30px rgba(0, 0, 0, .45), 0 1px 3px rgba(0, 0, 0, .4);
  color-scheme: dark;
}

html, body { height: 100%; }
body {
  background: var(--bg) radial-gradient(130% 90% at 45% 30%, var(--bg2), var(--bg));
  color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.4; overflow: hidden;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.lbl { font-family: var(--f-display); font-weight: 600; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

.app { height: 100%; display: grid; grid-template-rows: auto 1fr; grid-template-columns: minmax(0, 1fr); }

/* ---------- top bar ---------- */
.top {
  display: flex; align-items: center; gap: 12px 18px; flex-wrap: wrap;
  padding: 10px 16px; background: var(--panel-solid); border-bottom: 1px solid var(--line); position: relative; z-index: 5;
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand svg { width: 34px; height: 34px; flex: none; }
.brand strong { display: block; font-family: var(--f-display); font-size: 22px; font-weight: 700; letter-spacing: .01em; line-height: 1; }
.brand span { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
.sites { display: flex; gap: 6px; background: var(--chip); padding: 4px; border-radius: 12px; }
.sites button {
  border: 0; background: transparent; border-radius: 9px; padding: 5px 12px; text-align: left; line-height: 1.15;
}
.sites button b { display: block; font-family: var(--f-display); font-size: 15px; font-weight: 600; }
.sites button span { display: block; font-size: 11.5px; color: var(--muted); }
.sites i { font-style: normal; }
.sites button[aria-selected="true"] { background: var(--panel-solid); box-shadow: var(--shadow); }
.sites button[aria-selected="true"] b { color: var(--accent); }
.clock { display: flex; align-items: center; gap: 10px; margin-left: auto; }
.clock .live { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 4px color-mix(in srgb, var(--ok) 22%, transparent); }
.clock .live.paused { background: var(--muted); box-shadow: none; }
.clock #clock { font-family: var(--f-mono); font-size: 15px; font-weight: 500; }
.clock .tl { font-size: 11.5px; color: var(--muted); }
.speed { display: flex; background: var(--chip); border-radius: 10px; padding: 3px; }
.speed button { border: 0; background: transparent; border-radius: 7px; min-width: 38px; height: 30px; padding: 0 8px; font-family: var(--f-mono); font-size: 13px; }
.speed button[aria-pressed="true"] { background: var(--ink); color: var(--panel-solid); }
.speed svg { width: 12px; height: 12px; display: block; margin: auto; fill: currentColor; }

/* ---------- main ---------- */
.main { position: relative; min-height: 0; min-width: 0; }
.stage { position: absolute; inset: 0; overflow: hidden; }
#gl { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
#gl:active { cursor: grabbing; }

.kpis { position: absolute; top: 16px; left: 16px; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; width: calc(100% - 550px); z-index: 1; }
.kpi { background: var(--panel); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid var(--line); border-radius: 12px; padding: 9px 12px; box-shadow: var(--shadow); min-width: 0; }
.kpi .v { font-family: var(--f-display); font-size: 21px; font-weight: 600; line-height: 1.1; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi .v small { font-size: 13px; color: var(--muted); font-weight: 500; }
.kpi .s { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar { height: 5px; background: var(--chip); border-radius: 5px; overflow: hidden; margin-top: 6px; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 5px; transition: width .3s; }

.chip { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border-radius: 99px; font-size: 11.5px; font-weight: 600; background: var(--chip); color: var(--muted); white-space: nowrap; }
.chip.ok { color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, transparent); }
.chip.warn { color: var(--warn); background: color-mix(in srgb, var(--warn) 16%, transparent); }
.chip.crit { color: var(--crit); background: color-mix(in srgb, var(--crit) 15%, transparent); }
.chip.acc { color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); }

.view-tools { position: absolute; right: 404px; top: 16px; display: flex; flex-direction: column; gap: 8px; }
.tool-btn { display: flex; align-items: center; gap: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; box-shadow: var(--shadow); font-size: 12.5px; font-weight: 600; }
.tool-btn[aria-pressed="true"] { color: var(--accent); }

.banner { position: absolute; left: 50%; top: 96px; transform: translateX(-50%); background: var(--ink); color: var(--panel-solid); border-radius: 99px; padding: 6px 16px; font-weight: 600; font-size: 13px; box-shadow: var(--shadow); white-space: nowrap; max-width: calc(100% - 32px); overflow: hidden; text-overflow: ellipsis; }

.call {
  position: absolute; left: 16px; top: 112px; width: min(330px, calc(100% - 32px)); background: var(--panel-solid); border: 1px solid var(--line);
  border-radius: 14px; box-shadow: var(--shadow); padding: 10px 12px; display: grid; grid-template-columns: 34px 1fr; gap: 4px 10px; animation: drop .35s ease-out;
}
.call .av { grid-row: span 3; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); }
.call .av svg { width: 17px; height: 17px; fill: currentColor; }
.call .who { font-size: 12px; color: var(--muted); }
.call .who b { color: var(--ink); }
.call .txt { font-size: 13.5px; }
.call .tr { font-size: 12.5px; color: var(--muted); font-style: italic; }
@keyframes drop { from { transform: translateY(-8px); opacity: 0; } to { transform: none; opacity: 1; } }

/* speech bubbles */
.bubbles { position: absolute; inset: 0; pointer-events: none; }
.bubble {
  position: absolute; left: 0; top: 0; max-width: 236px; min-width: 120px; background: var(--panel-solid); color: var(--ink);
  border-radius: 12px; padding: 7px 10px 8px; box-shadow: var(--shadow); border: 1px solid var(--line); font-size: 13px; line-height: 1.3;
  transform-origin: 50% 100%; will-change: transform; animation: pop .25s ease-out;
}
.bubble::after { content: ""; position: absolute; left: 50%; bottom: -6px; width: 12px; height: 12px; background: var(--panel-solid); border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); transform: translateX(-50%) rotate(45deg); }
.bubble .h { display: flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 700; margin-bottom: 2px; }
.bubble .h .d { width: 9px; height: 9px; border-radius: 50%; border: 1px solid rgba(0,0,0,.25); }
.bubble .lang { font-family: var(--f-mono); font-size: 10px; font-weight: 500; padding: 0 5px; border-radius: 4px; background: var(--chip); color: var(--muted); }
.bubble .tr { display: block; margin-top: 3px; padding-top: 3px; border-top: 1px dashed var(--line); color: var(--muted); font-size: 12px; font-style: italic; }
.no-tr .bubble .tr, .no-tr .call .tr { display: none; }
@keyframes pop { from { opacity: 0; scale: .9; } to { opacity: 1; scale: 1; } }

.summary { position: absolute; inset: 0; display: grid; place-items: center; background: color-mix(in srgb, var(--bg) 55%, transparent); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); padding: 16px; z-index: 4; }
.summary .card { background: var(--panel-solid); border-radius: 18px; box-shadow: var(--shadow); padding: 22px; width: min(560px, 100%); border: 1px solid var(--line); }
.summary h2 { font-family: var(--f-display); font-size: 30px; margin: 0 0 4px; text-wrap: balance; }
.summary p { margin: 0 0 14px; color: var(--muted); }
.summary .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.summary .cols > div { background: var(--chip); border-radius: 12px; padding: 12px; min-width: 0; }
.summary .cols b { font-family: var(--f-display); font-size: 17px; }
.summary dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; margin: 8px 0 0; font-size: 13px; }
.summary dt { color: var(--muted); }
.summary dd { margin: 0; text-align: right; }
.summary .actions { display: flex; gap: 10px; margin-top: 16px; align-items: center; flex-wrap: wrap; }
.btn { border: 0; border-radius: 10px; padding: 9px 16px; font-weight: 700; background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: var(--chip); color: var(--ink); }

/* phase stepper */
.steps {
  position: absolute; left: 16px; right: 404px; bottom: 16px; background: var(--panel); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 10px 14px 12px; min-width: 0;
}
.steps .head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 8px; }
.steps .head b { font-family: var(--f-display); font-size: 15px; font-weight: 600; }
.steps ol { list-style: none; margin: 0; padding: 0; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(84px, 1fr); overflow-x: auto; scrollbar-width: thin; }
.steps li { position: relative; min-width: 0; }
.steps li::before { content: ""; position: absolute; top: 10px; left: 50%; right: -50%; height: 2px; background: var(--line); }
.steps li:last-child::before { display: none; }
.steps li.done::before { background: var(--accent); }
.steps button { border: 0; background: none; width: 100%; padding: 0 4px; display: flex; flex-direction: column; align-items: center; text-align: center; position: relative; }
.steps .dot { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); background: var(--panel-solid); display: grid; place-items: center; font-family: var(--f-mono); font-size: 10.5px; color: var(--muted); z-index: 1; }
.steps li.done .dot { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.steps li.now .dot { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 20%, transparent); }
.steps .nm { font-size: 12px; font-weight: 600; margin-top: 4px; line-height: 1.15; }
.steps .tm { font-family: var(--f-mono); font-size: 10.5px; color: var(--muted); }

/* dock */
.dock {
  position: absolute; top: 16px; right: 16px; bottom: 16px; width: 372px; display: flex; flex-direction: column; background: var(--panel);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); overflow: hidden;
}
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); border-bottom: 1px solid var(--line); flex: none; }
.tabs button { border: 0; background: none; padding: 11px 4px 10px; font-family: var(--f-display); font-weight: 600; font-size: 14.5px; color: var(--muted); border-bottom: 2px solid transparent; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.panel { padding: 14px; overflow-y: auto; flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 14px; }
.sec { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.sec > .lbl { display: flex; justify-content: space-between; align-items: center; gap: 8px; }

.who-card { border: 1px solid var(--line); border-radius: 14px; padding: 12px; background: var(--panel-solid); display: grid; gap: 8px; }
.who-card .top-row { display: flex; align-items: center; gap: 10px; }
.helm { width: 30px; height: 30px; border-radius: 50%; flex: none; border: 2px solid rgba(0,0,0,.18); position: relative; }
.helm::after { content: ""; position: absolute; left: -3px; right: -3px; bottom: 6px; height: 3px; border-radius: 2px; background: inherit; filter: brightness(.88); }
.who-card h3 { margin: 0; font-family: var(--f-display); font-size: 20px; line-height: 1; }
.who-card .role { color: var(--muted); font-size: 12.5px; }
.kv { display: grid; grid-template-columns: 92px 1fr; gap: 4px 10px; font-size: 13px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.follow { justify-self: start; }

.rows { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--panel-solid); }
.row { display: grid; grid-template-columns: 22px 1fr auto; align-items: center; gap: 10px; padding: 8px 10px; border: 0; border-top: 1px solid var(--line); background: none; text-align: left; width: 100%; }
.row:first-child { border-top: 0; }
.row:hover { background: var(--chip); }
.row[aria-current="true"] { background: color-mix(in srgb, var(--accent) 9%, transparent); }
.row .helm { width: 20px; height: 20px; }
.row .helm::after { bottom: 3px; height: 2px; }
.row .t { min-width: 0; }
.row .t b { font-weight: 700; }
.row .t .sub { display: block; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.grp { font-size: 12px; color: var(--muted); padding: 6px 10px; background: var(--chip); font-weight: 600; display: flex; justify-content: space-between; gap: 8px; }
.van-ico { width: 22px; height: 14px; }

.cond { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.cond > div { background: var(--panel-solid); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; min-width: 0; }
.cond .v { font-family: var(--f-mono); font-size: 16px; font-weight: 500; }
.cond .wide { grid-column: span 2; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.rules { font-size: 12.5px; color: var(--muted); margin: 0; padding-left: 16px; display: grid; gap: 2px; }
.list { display: flex; flex-direction: column; gap: 0; border: 1px solid var(--line); border-radius: 12px; background: var(--panel-solid); overflow: hidden; }
.li { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 8px 10px; border-top: 1px solid var(--line); font-size: 13px; }
.li:first-child { border-top: 0; }
.li .m { color: var(--muted); font-size: 12px; }
.empty { color: var(--muted); font-size: 13px; padding: 10px; }
.note { font-size: 12px; color: var(--muted); margin: 0; }

.stack { display: flex; flex-direction: column-reverse; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); }
.stack > div { display: flex; justify-content: space-between; gap: 10px; padding: 6px 10px; font-size: 12.5px; color: #1d232a; min-height: 30px; align-items: center; }
.stack > div span:last-child { font-family: var(--f-mono); font-size: 11.5px; white-space: nowrap; }
.prod .li { grid-template-columns: 1fr auto; }
.prod .li b { font-weight: 700; }
.prod .bar { grid-column: span 2; margin-top: 2px; }

.log { display: flex; flex-direction: column; gap: 8px; }
.log .e { display: grid; grid-template-columns: 52px 1fr; gap: 8px; font-size: 13px; }
.log .e .tm { font-family: var(--f-mono); font-size: 11px; color: var(--muted); padding-top: 2px; }
.log .e b { font-weight: 700; }
.log .e .tr { display: block; color: var(--muted); font-style: italic; font-size: 12px; }
.log .e .site { font-family: var(--f-mono); font-size: 10px; padding: 0 4px; border-radius: 4px; background: var(--chip); color: var(--muted); margin-right: 4px; }
.no-tr .log .tr { display: none; }

.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- phones ---------- */
@media (max-width: 860px) {
  body { overflow: auto; }
  .app { height: auto; min-height: 100%; }
  .top { padding: 10px 16px; gap: 10px; }
  .brand span { display: none; }
  .clock { margin-left: auto; }
  .clock .tl { display: none; }
  .sites { order: 5; width: 100%; }
  .sites button { flex: 1; padding: 5px 8px; }
  .sites .lg { display: none; }
  .speed { order: 4; }
  .main { display: flex; flex-direction: column; }
  .stage { position: relative; inset: auto; height: 60vh; height: 60svh; min-height: 340px; }
  .kpis { position: static; margin: 12px 16px 0; width: auto; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kpi { padding: 7px 10px; }
  .kpi .v { font-size: 18px; }
  .view-tools { right: 8px; top: auto; bottom: 8px; flex-direction: row; }
  .banner { top: 8px; font-size: 12px; }
  .call { top: 8px; left: 8px; width: min(300px, calc(100% - 16px)); }
  .bubble { max-width: 190px; font-size: 12px; }
  .steps { position: static; margin: 12px 16px 0; min-width: 0; }
  .steps ol { min-width: 0; }
  .dock { position: static; width: auto; margin: 12px 16px 16px; max-height: none; min-width: 0; }
  .panel { overflow: visible; }
}
@media (prefers-reduced-motion: reduce) {
  .bubble, .call { animation: none; }
  .bar i { transition: none; }
}
</style>

<div class="app" id="app">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 34 34" aria-hidden="true">
        <rect x="1" y="1" width="32" height="32" rx="9" fill="var(--ink)"/>
        <path d="M7 21.5 17 26l10-4.5" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linejoin="round"/>
        <path d="M7 16.5 17 21l10-4.5" fill="none" stroke="var(--panel-solid)" stroke-width="2.4" stroke-linejoin="round" opacity=".55"/>
        <path d="M17 7 27 11.5 17 16 7 11.5Z" fill="var(--panel-solid)"/>
      </svg>
      <div><strong>Bodenleger Live</strong><span>Pavimentos epóxi · 2 obras em simultâneo</span></div>
    </div>
    <div class="sites" role="tablist" aria-label="Obra em foco" id="sites">
      <button role="tab" data-site="A" aria-selected="true"><b>Obra A<i class="lg"> · Armazém</i></b><span><i class="lg">Chefe </i>Jord<i class="lg"> · 4 pessoas</i></span></button>
      <button role="tab" data-site="B" aria-selected="false"><b>Obra B<i class="lg"> · Garagem</i></b><span><i class="lg">Chefe </i>Thomas<i class="lg"> · 3 pessoas</i></span></button>
      <button role="tab" data-site="all" aria-selected="false"><b>Ambas</b><span>Vista geral</span></button>
    </div>
    <div class="clock">
      <span class="live" id="live" aria-hidden="true"></span>
      <span id="clock" class="num" aria-live="off">Seg · 07:00</span>
      <span class="tl" id="tl">timelapse</span>
    </div>
    <div class="speed" role="group" aria-label="Velocidade da simulação" id="speed">
      <button data-speed="0" aria-pressed="false" aria-label="Pausa"><svg viewBox="0 0 12 12"><rect x="1.5" y="1" width="3" height="10" rx="1"/><rect x="7.5" y="1" width="3" height="10" rx="1"/></svg></button>
      <button data-speed="0.5" aria-pressed="false">½×</button>
      <button data-speed="1" aria-pressed="true">1×</button>
      <button data-speed="3" aria-pressed="false">3×</button>
    </div>
  </header>

  <main class="main">
    <section class="stage" id="stage" aria-label="Vista 3D das obras. Arraste para mover, use a roda ou dois dedos para zoom; toque num operário para ver detalhes.">
      <canvas id="gl"></canvas>
      <div class="bubbles" id="bubbles"></div>
      <div class="view-tools">

/* =====================================================================

}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const f1 = n => n.toLocaleString('pt-PT', { minimumFractionDigits: 1, maximumFractionDigits: 1 });

/* =====================================================================

const CELL = 0.5;           // metros por célula do pavimento

const GAP_RATE = 220;       // noites, cura e fim de semana

const B = { BLAST: 1, VAC: 2, REP: 4, PRIM: 8, SAND: 16, COAT: 32, ROLL: 64, QUARTZ: 128, SWEPT: 256, SEAL: 512, WETC: 1024, WETS: 2048 };

/* =====================================================================
   Percursos: at(q) devolve a posição; ord(x,z) diz em que fração q
   o percurso passa por esse ponto (a mesma função pinta o chão).
   ===================================================================== */
function serp(x0, z0, x1, z1, lane) {
  const W = x1 - x0, depth = z1 - z0, n = Math.max(1, Math.round(depth / lane)), lw = depth / n;
  return {
    n,
    at(q) {
      const f = clamp(q, 0, 1) * n, i = Math.min(n - 1, Math.floor(f)), u = f - i, fwd = i % 2 === 0;
      return { x: fwd ? x0 + u * W : x1 - u * W, z: z0 + (i + 0.5) * lw, hx: fwd ? 1 : -1, hz: 0, lw };
    },
    ord(x, z) {
      const i = clamp(Math.floor((z - z0) / lw), 0, n - 1), u = clamp((x - x0) / W, 0, 1);
      return (i + (i % 2 === 0 ? u : 1 - u)) / n;
    },
    inside: (x, z) => x >= x0 && x <= x1 && z >= z0 && z <= z1,
  };
}
function perim(x0, z0, x1, z1, m) {
  const a = x0 + m / 2, b = z0 + m / 2, c = x1 - m / 2, d = z1 - m / 2, L1 = c - a, L2 = d - b, tot = 2 * (L1 + L2);
  return {
    at(q) {
      let s = clamp(q, 0, 1) * tot;
      if (s < L1) return { x: a + s, z: b, hx: 1, hz: 0 }; s -= L1;
      if (s < L2) return { x: c, z: b + s, hx: 0, hz: 1 }; s -= L2;
      if (s < L1) return { x: c - s, z: d, hx: -1, hz: 0 }; s -= L1;
      return { x: a, z: d - s, hx: 0, hz: -1 };
    },
    ord(x, z) {
      const dl = x - x0, dr = x1 - x, dt = z - z0, db = z1 - z, mn = Math.min(dl, dr, dt, db);
      let s;
      if (mn === dt) s = clamp(x - a, 0, L1);
      else if (mn === dr) s = L1 + clamp(z - b, 0, L2);
      else if (mn === db) s = L1 + L2 + clamp(c - x, 0, L1);
      else s = 2 * L1 + L2 + clamp(d - z, 0, L2);
      return s / tot;
    },
    inside: (x, z) => x >= x0 && x <= x1 && z >= z0 && z <= z1 && (x - x0 < m || x1 - x < m || z - z0 < m || z1 - z < m),
  };
}
function polyPath(pts) {
  const seg = []; let tot = 0;
  for (let i = 1; i < pts.length; i++) { const l = Math.hypot(pts[i].x - pts[i - 1].x, pts[i].z - pts[i - 1].z); seg.push(l); tot += l; }
  return {
    tot,
    at(q) {
      let s = clamp(q, 0, 1) * tot;
      for (let i = 0; i < seg.length; i++) {
        if (s <= seg[i] || i === seg.length - 1) {
          const u = seg[i] ? clamp(s / seg[i], 0, 1) : 0, p = pts[i], r = pts[i + 1];
          return { x: lerp(p.x, r.x, u), z: lerp(p.z, r.z, u), hx: (r.x - p.x) / (seg[i] || 1), hz: (r.z - p.z) / (seg[i] || 1) };
        }
        s -= seg[i];
      }
      return { x: pts[0].x, z: pts[0].z, hx: 1, hz: 0 };
    },
  };
}

/* =====================================================================
   Comportamentos: cada um é uma função pura do tempo da fase.
   ctx = { p: progresso 0..1, t: minutos na fase, ph, S }
   ===================================================================== */
const opQ = (ctx, k, lag = 0) => { const op = ctx.ph.ops[k]; return (ctx.p - op.win[0]) / (op.win[1] - op.win[0]) - lag; };
function follow(k, o) {
  return ctx => {
    const op = ctx.ph.ops[k], q = opQ(ctx, k, o.lag || 0), P = op.path.at(clamp(q, 0, 1));
    let x = P.x, z = P.z;
    if (o.wiggle) { const w = Math.sin(ctx.t * (o.wf || 2)) * o.wiggle; x += -P.hz * w; z += P.hx * w; }
    if (o.side) { x += -P.hz * o.side; z += P.hx * o.side; }
    const working = q >= 0 && q <= 1;
    const tool = typeof o.tool === 'function' ? o.tool(ctx) : o.tool;
    return { x, z, face: Math.atan2(P.hx, P.hz), anim: working ? o.anim : 'idle', tool: working ? tool : null,
      task: working ? (typeof o.task === 'function' ? o.task(ctx) : o.task) : (q < 0 ? 'À espera da vez' : 'Concluído — a apoiar'), emit: working ? o.emit : null };
  };
}
function trace(path, win, o) {
  return ctx => {
    const q = (ctx.p - win[0]) / (win[1] - win[0]), P = path.at(clamp(q, 0, 1)), working = q >= 0 && q <= 1;
    return { x: P.x, z: P.z, face: Math.atan2(P.hx, P.hz), anim: working ? o.anim : 'idle', tool: working ? o.tool : null, task: working ? o.task : 'Concluído — a apoiar', emit: working ? o.emit : null };
  };
}
// visita pontos: anda, e ajoelha/trabalha em cada um
function visit(pts, o) {
  return ctx => {
    const n = pts.length, f = clamp(ctx.p, 0, 0.9999) * n, i = Math.floor(f), u = f - i, wf = o.walk ?? 0.35;
    const prev = i === 0 ? (o.from ? o.from(ctx) : pts[0]) : pts[i - 1], cur = pts[i];
    if (u < wf) { const k = u / wf; return { x: lerp(prev.x, cur.x, k), z: lerp(prev.z, cur.z, k), anim: 'walk', tool: o.carry || null, task: o.task }; }
    return { x: cur.x, z: cur.z, face: cur.face, anim: o.anim, tool: o.tool, task: o.task, emit: o.emit };
  };
}
// vaivém entre o posto de mistura e a frente de trabalho
function shuttle(k, o) {
  return ctx => {
    const st = ctx.S.mixSpot(o.slot || 0), c = (((ctx.t / o.period) + (o.offset || 0)) % 1 + 1) % 1;
    const op = ctx.ph.ops[k], q = clamp(opQ(ctx, k) + (o.lead || 0.01), 0, 1), P = op.path.at(q);
    const fr = { x: P.x, z: P.z + (P.lw ? P.lw * 0.5 : 0) + 0.4 };
    const m = o.mix, w1 = m + 0.16, w2 = w1 + 0.1;

    if (c < w1) { const u = (c - m) / 0.16; return { x: lerp(st.x, fr.x, u), z: lerp(st.z, fr.z, u), anim: 'carry', tool: 'bucket', task: 'A levar o balde misturado' }; }
    if (c < w2) return { x: fr.x, z: fr.z, face: Math.PI, anim: 'pour', tool: 'bucketPour', task: o.pourTask || 'A despejar em linha' };
    const u = (c - w2) / (1 - w2); return { x: lerp(fr.x, st.x, u), z: lerp(fr.z, st.z, u), anim: 'carry', tool: 'bucket', task: 'De volta ao posto de mistura' };
  };
}
function carryLoop(o) {

    return { x: P.x, z: P.z, anim: 'carry', tool: c < 0.5 ? o.tool || 'box' : null, task: o.task };

}
function stay(fn, o) { return ctx => { const p = fn(ctx.S); return { x: p.x, z: p.z, face: p.face ?? o.face, anim: o.anim, tool: o.tool, task: o.task, emit: o.emit }; }; }

  return ctx => {
    const S = ctx.S, k = o.k || 0.07, tt = ctx.t, kneel = (tt * k) % 1 < 0.25, t0 = kneel ? Math.floor(tt * k) / k : tt;

    return { x, z, anim: kneel ? 'kneel' : 'walk', tool: kneel ? o.tool : null, task: o.task };
  };
}
// troca de comportamento dentro da fase: [[p0, p1, fn], ...]
function seq(parts) {
  return ctx => {
    for (const [a, b, fn] of parts) if (ctx.p >= a && ctx.p < b) return fn({ ...ctx, p: (ctx.p - a) / (b - a), t: ctx.t - a * ctx.ph.dur, ph: { ...ctx.ph, ops: ctx.ph.ops } });
    const [a, b, fn] = parts[parts.length - 1]; return fn({ ...ctx, p: 1, t: ctx.t - a * ctx.ph.dur });
  };
}

/* =====================================================================
   Fases (modelos). Valores Sika: fichas técnicas Sika Suíça (out. 2026).

function inner(S, lane, m = 0.75) { return serp(m, m, S.W - m, S.D - m, lane); }

  sweepSeal: (s, e, o) => ({
    id: 'sweepSeal', name: 'Limpar o excesso e selar', short: 'Selagem', de: 'Absaugen + Versiegelung', start: tm(s), end: tm(e),
    ops: S => [
      { bit: B.SWEPT, path: serp(0, 0, S.W / 2, S.D, 2), win: [0, 0.38] },

    ],
    crew: () => {
      const c = {};
      c[o.sweepA] = seq([[0, 0.4, follow(0, { tool: 'vacuum', anim: 'push', task: 'Varrer e aspirar a areia solta', emit: 'dust' })],

      c[o.sweepB] = seq([[0, 0.4, follow(1, { tool: 'vacuum', anim: 'push', task: 'Varrer e aspirar a areia solta', emit: 'dust' })],

        o.lines.forEach((w, j) => {

            const n = mine.length, f = clamp(ctx.p / 0.85, 0, 0.9999) * n, i = Math.floor(f), u = f - i, L = mine[i];

        });
      }
      (o.packers || []).forEach((w, i) => { c[w] = carryLoop({ from: S => S.mixSpot(0), to: S => S.vanDoor(i % 2), period: 14, offset: i * 0.33, task: 'Limpar ferramentas e carregar a Sprinter' }); });
      return c;
    },
    lines: o.lines,
  }),
};

  S.bitTime = {}; BITS.forEach(b => { S.bitTime[b] = new Float32Array(S.N).fill(Infinity); });
  const inCol = (x, z) => (S.columns || []).some(c => Math.abs(c.x - x) < 0.3 && Math.abs(c.z - z) < 0.3);
  S.phases.forEach(ph => ph.ops.forEach(op => {
    const arr = S.bitTime[op.bit];
    for (let i = 0; i < S.N; i++) {
      const x = (i % S.nx + 0.5) * CELL, z = (Math.floor(i / S.nx) + 0.5) * CELL;
      if (!op.path.inside(x, z) || inCol(x, z)) continue;
      const t = ph.start + (op.win[0] + op.path.ord(x, z) * (op.win[1] - op.win[0])) * ph.dur;

      mine.forEach((ci, n) => { S.crackTime[ci] = rp.start + ((n + 0.35 + 0.4 * 0.65) / mine.length) * rp.dur; });

  return `<button class="row" data-person="${c.id}" aria-current="${state.sel === c.id}">${helmDot(c)}<span class="t"><b>${esc(c.name)}</b>${c.chief ? ' <span class="chip acc">Chefe</span>' : ''}<span class="sub">${esc(P.present && st ? st.task : c.langs)}</span></span>${status}</button>`;
}
function renderCrew() {
  const P = people.get(state.sel), c = P.c, st = P.state, S = SITES.find(s => s.id === c.site);
  const line = P.lastLine;
  const card = `<div class="who-card">
    <div class="top-row">${helmDot(c)}<div><h3>${esc(c.name)}</h3><div class="role">${esc(c.role)} · ${esc(S.title)}</div></div></div>
    <dl class="kv">
      <dt>Línguas</dt><dd>${esc(c.langs)}</dd>
      <dt>Agora</dt><dd>${P.present && st ? esc(st.task) : 'Fora da obra (Magazin ou casa)'}</dd>
      <dt>EPI</dt><dd>${esc((P.present && st && PPE[st.tool]) || 'Capacete · colete · botas S3')}</dd>
      <dt>Última fala</dt><dd>${line ? `<span class="lang">${line.lang.toUpperCase()}</span> ${esc(line.text)}${line.pt && line.lang !== 'pt' ? `<br><i class="m" style="color:var(--muted)">${esc(line.pt)}</i>` : ''}` : '—'}</dd>
    </dl>
    <button class="tool-btn follow" id="follow-btn" aria-pressed="${state.follow}">${state.follow ? 'A seguir na câmara' : 'Seguir na câmara'}</button>
  </div>`;
  const group = (sid) => {
    const S2 = SITES.find(s => s.id === sid), ph = S2.cur;
    const members = CREW.filter(x => x.site === sid && (!x.guest || people.get(x.id).present));
    return `<div class="grp"><span>${esc(S2.title)}</span><span>${ph ? esc(ph.short) : 'Sem trabalho agora'}</span></div>${members.map(personRow).join('')}`;
  };
  const fleet = vans.map(v => `<div class="li"><span><b>Sprinter ${v.id}</b> · Mercedes-Benz Sprinter, branca<span class="m" style="display:block">${esc(v.use)} · equipa ${esc(v.site === 'A' ? 'Jord' : 'Thomas')}</span></span><span class="chip ${v.status.startsWith('Na obra') ? 'ok' : v.status === 'No Magazin' ? '' : 'warn'}">${esc(v.status)}</span></div>`).join('');
  $('#tab-crew').innerHTML = `
    <div class="sec">${card}</div>
    <div class="sec"><div class="lbl">Equipas · 2 chefes, 5 operários</div><div class="rows">${group('A')}${group('B')}</div></div>
    <div class="sec"><div class="lbl">Escritório</div><div class="list"><div class="li"><span><b>${OFFICE.name}</b> · ${OFFICE.role}<span class="m" style="display:block">Não vai às obras nem ao Magazin · fala ${OFFICE.langs.toLowerCase()}</span></span><span class="chip">${OFFICE.where}</span></div></div></div>
    <div class="sec"><div class="lbl">Frota · 4 carrinhas</div><div class="list">${fleet}</div></div>`;
}
function renderCtrl() {
  const S = focusSite(), c = climate(S, state.t), [cls, lab] = dewState(c.m);
  const rs = S.readings.filter(r => r.t <= state.t);
  const label = { cm: ['Humidade do suporte (CM)', '%', v => v <= 4, '≤ 4 %'], po: ['Arrancamento (Haftzug)', 'N/mm²', v => v >= 1.5, '≥ 1,5 N/mm²'], dew: ['Margem ao ponto de orvalho', 'K', v => v >= 3, '≥ 3 K'], wft: ['Espessura húmida (pente)', 'mm', v => v >= 1.9, '≈ 2 mm'] };
  const rows = rs.length ? rs.map(r => { const L = label[r.kind], ok = L[2](r.v); return `<div class="li"><span><b>${L[0]}</b><span class="m" style="display:block">${dayName(r.t)} ${hhmm(r.t)} · ${esc(nameOf(r.who))} · ${esc(r.ph)} · limite ${L[3]}</span></span><span><span class="num">${f1(r.v)} ${L[1]}</span> <span class="chip ${ok ? 'ok' : 'crit'}">${ok ? 'OK' : 'Fora'}</span></span></div>`; }).join('') : '<div class="empty">Ainda sem medições nesta obra.</div>';
  $('#tab-ctrl').innerHTML = `
    <div class="sec"><div class="lbl"><span>Clima agora · ${esc(S.short)}</span><span class="chip ${cls}">${lab}</span></div>
      <div class="cond">
        <div><div class="lbl">Ar</div><div class="v">${f1(c.air)} °C</div></div>
        <div><div class="lbl">Humidade relativa</div><div class="v">${f0(c.rh)} %</div></div>
        <div><div class="lbl">Suporte</div><div class="v">${f1(c.sub)} °C</div></div>
        <div><div class="lbl">Ponto de orvalho</div><div class="v">${f1(c.td)} °C</div></div>
        <div class="wide"><span><span class="lbl">Margem</span><div class="v">${f1(c.m)} K</div></span><span class="note" style="max-width:190px">Suporte tem de estar pelo menos 3 K acima do ponto de orvalho.</span></div>
      </div>
      ${S.dehum && state.t >= S.climate.dryAt ? '<p class="note">Desumidificador ligado desde segunda 09:00.</p>' : ''}
    </div>
    <div class="sec"><div class="lbl">Medições</div><div class="list">${rows}</div></div>
    <div class="sec"><div class="lbl">Regras das fichas técnicas</div>
      <ul class="rules"><li>Ar e suporte entre +10 e +30 °C</li><li>Humidade relativa ≤ 80 %</li><li>Suporte ≥ 3 K acima do ponto de orvalho</li><li>Humidade residual ≤ 4 % CM, sem humidade ascendente</li><li>Arrancamento ≥ 1,5 N/mm² · compressão ≥ 25 N/mm²</li><li>Aquecer só com aquecedores elétricos</li></ul>
    </div>
    <div class="sec"><div class="lbl">Tempos (aprox.)</div><div class="list">${S.times.map(([a, b]) => `<div class="li"><span>${esc(a)}</span><span class="num" style="text-align:right">${esc(b)}</span></div>`).join('')}</div>
      <p class="note">Fichas técnicas Sika Suíça (Sikafloor®-160, -150 Plus, -264 Plus; Sikadur®-31+). Confirme sempre na ficha técnica atual.</p></div>`;
}
function renderMat() {
  const S = focusSite();
  const area = S.N * CELL * CELL;
  const stack = S.layers.map(l => `<div style="background:${l.col};min-height:${l.h}px"><span>${esc(l.name)}</span><span>${esc(l.mm)}</span></div>`).join('');
  const prods = S.products.map(p => {
    const doneCells = S.done[p.bit] || 0, tot = S.totals[p.bit] || 1, kg = doneCells * CELL * CELL * p.rate, plan = tot * CELL * CELL * p.rate;
    const pct = Math.round(doneCells / tot * 100);
    return `<div class="li"><span><b>${esc(p.name)}</b><span class="m" style="display:block">${esc(p.use)}${p.mix ? ` · A : B = ${esc(p.mix)}` : ''} · consumo: ${esc(p.pds)}</span></span><span class="num" style="text-align:right">${p.rate ? `${f0(kg)} kg<span class="m" style="display:block">de ~${f0(plan)}${p.est ? ' (estim.)' : ''}</span>` : `${pct}%`}</span><div class="bar"><i style="width:${pct}%"></i></div></div>`;
  }).join('');
  $('#tab-mat').innerHTML = `
    <div class="sec"><div class="lbl"><span>Sistema · ${esc(S.short)}</span><span>${f0(area)} m²</span></div><div class="stack">${stack}</div>
      <p class="note">${esc(S.system)} · cor ${esc(S.coatName)}.</p></div>
    <div class="sec"><div class="lbl">Consumo nesta obra</div><div class="list prod">${prods}</div>
      <p class="note">Consumo = ficha técnica × área já coberta (aprox.; a areia do primário é estimativa). Rácios A : B em peso, da vossa folha «Mischverhältnisse» (out. 2026) e da ficha do Sikadur®-31+.</p></div>`;
}
function renderLog() {
  const items = state.log.filter(e => state.focus === 'all' || e.site === state.focus).slice(0, 50);
  $('#tab-log').innerHTML = items.length ? `<div class="log">${items.map(e => {
    const c = e.who && people.get(e.who) ? people.get(e.who).c : null;
    return `<div class="e"><span class="tm">${dayName(e.t)}<br>${hhmm(e.t)}</span><span><span class="site">${e.site}</span>${c ? `<b>${esc(c.name)}</b> <span class="lang" style="font-family:var(--f-mono);font-size:10px;color:var(--muted)">${e.lang.toUpperCase()}</span> ` : ''}${esc(e.text)}${e.pt && e.lang !== 'pt' ? `<span class="tr">${esc(e.pt)}</span>` : ''}</span></div>`;
  }).join('')}</div>` : '<div class="empty">As falas, medições e chamadas aparecem aqui.</div>';
  ui.logDirty = false;
}
function refreshKPIs() {
  const S = focusSite(), ph = S.cur, c = climate(S, state.t), [cls, lab] = dewState(c.m);
  const next = S.phases.find(p => p.start > state.t);
  $('#k-phase').textContent = ph ? ph.short : (state.t >= S.end ? 'Entregue' : next ? `Próx.: ${next.short}` : '—');
  $('#k-phase-bar').style.width = `${Math.round((ph ? S.p : state.t >= S.end ? 1 : 0) * 100)}%`;
  const op = ph && ph.ops[0];
  const area = S.N * CELL * CELL;
  if (op) { const done = (S.done[op.bit] || 0) * CELL * CELL, tot = (S.totals[op.bit] || 1) * CELL * CELL; $('#k-area').innerHTML = `${f0(done)} <small>/ ${f0(tot)} m²</small>`; $('#k-area-s').textContent = `${ph.de} · ${Math.round(done / tot * 100)} %`; }
  else { $('#k-area').innerHTML = `${f0(area)} <small>m²</small>`; $('#k-area-s').textContent = S.system; }
  $('#k-dew').innerHTML = `${f1(c.m)} <small>K margem</small>`;
  $('#k-dew-s').innerHTML = `<span class="chip ${cls}">${lab}</span> ${f1(c.sub)} °C / ${f1(c.td)} °C`;
  const kg = S.products.reduce((s, p) => s + (S.done[p.bit] || 0) * CELL * CELL * p.rate, 0);
  $('#k-mat').innerHTML = `${f0(kg)} <small>kg</small>`;
  $('#k-mat-s').textContent = `${S.short}: resina, areia e quartzo`;
}
function refreshUI(full) {
  $('#clock').textContent = clockStr(state.t);
  $('#live').classList.toggle('paused', state.speed === 0);
  const anyWork = SITES.some(S => S.cur && !S.cur.idle);
  $('#tl').textContent = state.speed === 0 ? 'em pausa' : `timelapse ×${f0((anyWork ? BASE_RATE : GAP_RATE) * state.speed * 60)}`;
  const S = focusSite(), ph = S.cur, banner = $('#banner');
  let msg = '';
  if (!ph || ph.idle) {
    const next = S.phases.find(p => p.start > state.t && !p.idle);
    const h = Math.floor(state.t % 1440 / 60), night = h < 6 || h >= 18;
    if (state.t >= S.end) msg = `${S.short}: obra entregue`;
    else if (ph && ph.idle) msg = `${ph.name} · ninguém pisa`;
    else if (next) msg = `${night ? 'Noite' : 'Sem trabalho'} · ${S.short}: próximo ${next.short}, ${dayName(next.start)} ${hhmm(next.start)}`;
  }
  banner.hidden = !msg; banner.textContent = msg;
  refreshKPIs(); updateSteps();
  if (ui.tab === 'crew') renderCrew();
  if (ui.tab === 'ctrl') renderCtrl();
  if (ui.tab === 'mat') renderMat();
  if (ui.tab === 'log' && (ui.logDirty || full)) renderLog();
}
function finish() {
  if (state.done) return;
  state.done = true; state.doneAt = performance.now();
  const col = S => {
    const kg = S.products.reduce((s, p) => s + (S.totals[p.bit] || 0) * CELL * CELL * p.rate, 0), m2 = S.N * CELL * CELL;
    const workDays = new Set(S.phases.filter(p => !p.idle).map(p => Math.floor(p.start / 1440))).size;
    const team = CREW.filter(c => c.site === S.id && !c.guest).map(c => c.name).join(', ');
    return `<div><b>${esc(S.title)}</b><dl><dt>Área</dt><dd class="num">${f0(m2)} m²</dd><dt>Dias de trabalho</dt><dd class="num">${workDays}</dd><dt>Material</dt><dd class="num">~${f0(kg)} kg</dd><dt>Equipa</dt><dd>${esc(team)}</dd><dt>Entregue</dt><dd>${dayName(S.end)} ${hhmm(S.end)}</dd></dl></div>`;
  };
  $('#summary').innerHTML = `<div class="card"><h2>Semana concluída: duas obras entregues</h2><p>2 chefes, 5 operários e 4 Sprinters. Recomeça sozinho daqui a 25 segundos.</p><div class="cols">${col(SITES[0])}${col(SITES[1])}</div><div class="actions"><button class="btn" id="again">Ver outra vez</button><button class="btn ghost" id="close-sum">Ficar a ver as obras</button></div></div>`;
  $('#summary').hidden = false;
}

/* ---------- eventos ---------- */
$('#sites').addEventListener('click', e => { const b = e.target.closest('button[data-site]'); if (b) setFocus(b.dataset.site); });
$('#speed').addEventListener('click', e => {
  const b = e.target.closest('button[data-speed]'); if (!b) return;
  state.speed = +b.dataset.speed;
  document.querySelectorAll('#speed button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  refreshUI();
});
$('#tabs').addEventListener('click', e => {
  const b = e.target.closest('button[data-tab]'); if (!b) return;
  ui.tab = b.dataset.tab;
  document.querySelectorAll('#tabs button').forEach(x => x.setAttribute('aria-selected', String(x === b)));
  ['crew', 'ctrl', 'mat', 'log'].forEach(k => { $('#tab-' + k).hidden = k !== ui.tab; });
  refreshUI(true);
});
$('#steps').addEventListener('click', e => { const b = e.target.closest('button[data-seek]'); if (b) seekTo(focusSite().phases[+b.dataset.seek].start - (+b.dataset.seek === 0 ? 20 : 0)); });
$('#tab-crew').addEventListener('click', e => {
  const r = e.target.closest('[data-person]');
  if (r) { selectPerson(r.dataset.person); return; }
  if (e.target.closest('#follow-btn')) { state.follow = !state.follow; refreshUI(); }
});
$('#tr-toggle').addEventListener('click', e => { state.tr = !state.tr; $('#app').classList.toggle('no-tr', !state.tr); e.currentTarget.setAttribute('aria-pressed', String(state.tr)); });
$('#recenter').addEventListener('click', () => { state.follow = false; flyTo(state.focus); refreshUI(); });
$('#summary').addEventListener('click', e => {
  if (e.target.closest('#again')) { seekTo(T0); }
  if (e.target.closest('#close-sum')) { $('#summary').hidden = true; state.doneAt = Infinity; }
});
function selectPerson(id) {
  state.sel = id;
  const site = people.get(id).c.site;
  if (state.focus !== 'all' && state.focus !== site) setFocus(site);
  if (ui.tab !== 'crew') $('#tabs button[data-tab="crew"]').click(); else refreshUI();
}
// tocar num operário
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
let downAt = null;
canvas.addEventListener('pointerdown', e => { downAt = [e.clientX, e.clientY]; state.follow = state.follow && true; });
canvas.addEventListener('pointerup', e => {
  if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 6) return;
  const r = canvas.getBoundingClientRect(); ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hits = ray.intersectObjects([...people.values()].filter(P => P.present).map(P => P.hit), false);
  if (hits.length) selectPerson(hits[0].object.userData.person);
});
controls.addEventListener('start', () => { camGoal.active = false; });

/* ---------- tamanho ---------- */
function resize() {
  const w = canvas.clientWidth, h = canvas.clientHeight; if (!w || !h) return;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stageEl);

/* ---------- luz do dia ---------- */
function updateLight() {
  const h = (state.t % 1440) / 60, day = smooth(5.5, 8, h) * (1 - smooth(18, 20.5, h)), warm = 1 - Math.min(Math.abs(h - 13) / 6, 1);
  sun.intensity = 0.35 + 1.0 * day; hemi.intensity = 0.16 + 0.24 * day;
  sun.color.setRGB(1, 0.86 + 0.14 * warm, 0.72 + 0.28 * warm).lerp(new THREE.Color(0x9fb4ff), 1 - day);
  renderer.toneMappingExposure = 0.72 + 0.36 * day;
  const f = controls.target, ang = (h - 6) / 12 * Math.PI;
  sun.position.set(f.x + 30 * Math.cos(ang) + 8, 40 + 10 * Math.sin(ang), f.z + 26);
  sun.target.position.set(f.x, 0, f.z);
}

/* ---------- auto-teste mínimo ---------- */
(() => {
  const s = serp(0, 0, 10, 6, 2); [0.1, 0.37, 0.8].forEach(q => { const p = s.at(q); console.assert(Math.abs(s.ord(p.x, p.z) - q) < 1e-6, 'serp ord/at', q); });
  const e = perim(0, 0, 10, 6, 1); [0.05, 0.4, 0.9].forEach(q => { const p = e.at(q); console.assert(Math.abs(e.ord(p.x, p.z) - q) < 0.02, 'perim ord/at', q); });
  console.assert(Math.abs(dewPoint(20, 50) - 9.26) < 0.1, 'dew point');
})();

/* ---------- ciclo ---------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  advance(dt);
  SITES.forEach(S => { updateFloor(S, state.t); if (S.dirty && now - S.lastUpload > 90) { S.tex.needsUpdate = true; S.rtex.needsUpdate = true; S.dirty = false; S.lastUpload = now; } chatTick(S, dt); });
  updatePeople(dt, false);
  if (state.speed > 0) updateParticles(dt);
  const selP = people.get(state.sel);
  ring.visible = !!(selP && selP.present); if (ring.visible) ring.position.set(selP.pos.x, 0.03, selP.pos.z);
  if (camGoal.active) {
    camGoal.u = Math.min(1, camGoal.u + dt / 1.1); const k = smooth(0, 1, camGoal.u);
    camera.position.lerpVectors(camGoal.from, camGoal.to, k); controls.target.lerpVectors(camGoal.tf, camGoal.tt, k);
    if (camGoal.u >= 1) camGoal.active = false;
  } else if (state.follow && selP && selP.present) {
    tmpV.set(selP.pos.x, 0, selP.pos.z).sub(controls.target).multiplyScalar(Math.min(1, dt * 3));
    controls.target.add(tmpV); camera.position.add(tmpV);
  }
  controls.update();
  updateLight();
  renderer.render(scene, camera);
  placeBubbles();
  ui.acc += dt;
  if (ui.acc > 0.25) { ui.acc = 0; refreshUI(); }
  if (state.done && now - state.doneAt > 25000) seekTo(T0);
  requestAnimationFrame(frame);
}

document.addEventListener('visibilitychange', () => { last = performance.now(); });
const hash = (location.hash || '').slice(1);
resize();
setFocus(hash === 'B' || hash === 'all' ? hash : 'A');
flyTo(state.focus, true);
updatePeople(0, true);
refreshUI(true);
window.__sim = { state, SITES, people, vans, seekTo, setFocus, renderer, sun, hemi, scene, matCache, bubbles, zoom: () => { controls.target.set(14, 0, 9); camera.position.set(24, 14, 24); camGoal.active = false; } };
requestAnimationFrame(frame);
})();
</script>
